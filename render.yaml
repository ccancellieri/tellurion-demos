    region: frankfurt
    plan: free
    healthCheckPath: /
    autoDeployTrigger: commit
  - type: web
    name: tellurion-zarr-demo
    runtime: docker
    repo: https://github.com/ccancellieri/tellurion-demos
    branch: main
    dockerfilePath: ./Dockerfile-zarr
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /
    autoDeployTrigger: commit
  - type: web
    name: tellurion-3d-demo
    runtime: docker
    repo: https://github.com/ccancellieri/tellurion-demos
    branch: main
    dockerfilePath: ./Dockerfile-3d
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /
    autoDeployTrigger: commit
