services:
  - type: web
    name: tellurion-vector-demo
    runtime: docker
    repo: https://github.com/ccancellieri/tellurion-demos
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /
    autoDeployTrigger: commit
